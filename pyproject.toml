[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-trajectory-eval"
version = "0.1.0"
description = "labbench pre-run manifest checks for automation packages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "labbench>=0.45,<0.46",
    "pydantic>=2.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bio-trajectory-eval = "bio_trajectory_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

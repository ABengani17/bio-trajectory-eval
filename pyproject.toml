[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-trajectory-eval"
version = "0.1.0"
description = "Trajectory-based evaluation harness for safe proxy AI-bio safeguard tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
]

[project.scripts]
bio-trajectory-eval = "bio_trajectory_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
